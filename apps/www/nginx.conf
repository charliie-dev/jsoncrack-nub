server {
    # IPv4 only on purpose. nginx aborts at config load if it cannot bind
    # [::]:8080, which crash-loops the container on hosts booted with
    # ipv6.disable=1 or a daemon without IPv6 in the container netns. Docker's
    # published port is dual-stack on the host side, so IPv6 clients still reach
    # a container listening on IPv4 only. Operators who attach the container
    # directly to an IPv6 network and need it to bind [::] can add that listen
    # back in their own build.
    listen 8080;

    root  /app;
    include /etc/nginx/mime.types;

    # The base image's main config points both logs at files under
    # /var/log/nginx, which compose mounts as a small tmpfs. Redirect them to the
    # container's stdout/stderr so `docker compose logs` shows requests and the
    # tmpfs stays empty.
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # `output: "export"` with the default trailingSlash: false writes every route as
    # a flat <route>.html, so a request ending in "/" has no file and no directory to
    # resolve to. Redirect it to the canonical slashless form rather than 404-ing:
    # /editor/ used to work by accident under the old per-route `try_files $uri
    # /editor.html`, and inbound links and embed srcs written that way exist.
    # Excludes "/" itself, which resolves to index.html.
    location ~ ^(/.+)/$ {
        return 301 $1;
    }

    # Extensionless request paths need .html appended. This one rule covers /editor,
    # /widget, /docs and /legal/* — the per-route blocks it replaces handled only the
    # first three, so the footer's /legal/* links fell through to nginx's bare 404.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Serve the app's exported 404 page instead of nginx's built-in one.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
