# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  jsoncrack:
    build:
      context: .
      dockerfile: apps/www/Dockerfile
      args:
        SITE_URL: ${SITE_URL:-https://jsoncrack.com}
    container_name: jsoncrack
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    # nginx runs as uid 65532 and needs these paths writable. A tmpfs mount is
    # created root-owned, so mode 0777 is what lets the unprivileged process use
    # it; the container drops every capability and runs a single process.
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 0777
      - type: tmpfs
        target: /run/nginx
        tmpfs:
          mode: 0777
      - type: tmpfs
        target: /var/lib/nginx/tmp
        tmpfs:
          mode: 0777
      - type: tmpfs
        target: /var/log/nginx
        tmpfs:
          mode: 0777
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
