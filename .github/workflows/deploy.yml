name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

# Least privilege by default; the deploy job asks for what Pages needs. Declaring
# pages: write and id-token: write here would hand them to the build job too, which
# only reads the repository.
permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up nub
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0
        with:
          cache: true

      - name: Restore Next.js cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/www/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/www/**.[jt]s', 'apps/www/**.[jt]sx', 'packages/**.[jt]s', 'packages/**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: nub ci

      # SITE_URL is exported as NEXT_PUBLIC_SITE_URL only when it carries a value.
      # An unset repository variable renders as an empty string, and @next/env skips any
      # key already present in process.env — verified by building with the var empty,
      # which masked apps/www/.env and fell back to jsoncrack.com. Without this the
      # Pages deploy publishes a robots.txt and sitemap advertising a domain this fork
      # does not control, since next-sitemap now generates robots.txt and the committed
      # copy that used to ship in public/ is gone.
      - name: Build
        run: |
          if [ -n "${SITE_URL:-}" ]; then export NEXT_PUBLIC_SITE_URL="$SITE_URL"; fi
          nub run build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: './apps/www/out'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
