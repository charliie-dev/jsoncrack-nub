name: Verify Pull Request

on:
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up nub
        uses: nubjs/setup-nub@v0
        with:
          cache: true

      - name: Install dependencies
        run: nub ci

      - name: Lint
        run: nub run lint

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # trivy rather than `nub audit`: nub only audits the dependencies declared in
      # the current package.json, and this repo's root is a pure workspace container
      # with none. See the audit task in mise.toml.
      #
      # Gated on fixable advisories only. An advisory with no released fix is not
      # actionable, so failing on it would just train everyone to ignore this job.
      - name: Audit dependencies
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up nub
        uses: nubjs/setup-nub@v0
        with:
          cache: true

      - name: Install dependencies
        run: nub ci

      - name: Test
        run: nub run test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up nub
        uses: nubjs/setup-nub@v0
        with:
          cache: true

      - name: Restore Next.js cache
        uses: actions/cache@v5
        with:
          path: apps/www/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/www/**.[jt]s', 'apps/www/**.[jt]sx', 'packages/**.[jt]s', 'packages/**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: nub ci

      - name: Build
        run: nub run build
